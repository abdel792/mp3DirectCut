name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Add-on version, if not defined, will be set to today's date in the format recommended by nvaccess/addonStore"
        required: false
        default: ''

      prerelease:
        description: 'True if this is a prerelease'
        type: boolean
        required: false
        default: false

      updateYear:
        description: 'Update addon_lastTestedNVDAVersion in buildVars.py to current year'
        type: boolean
        required: false
        default: false

      channel:
        type: choice
        description: Choose a channel for your release
        options:
          - stable
          - dev
          - beta
        default: stable
        required: false

jobs:
  buildAndUpload:
    # Use Windows runner to leverage pre-built wxPython wheels for Python 3.13 from PyPI,
    # avoiding long source compilation times required on Linux.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Set date environment variables
      run: |
        $curDate = Get-Date -Format "yyyyMMdd"
        $curYear = Get-Date -Format "yyyy"
        $tagName = "v" + (Get-Date -Format "yy.MM.dd")

        echo "CUR_DATE=$curDate" >> $env:GITHUB_ENV
        echo "CUR_YEAR=$curYear" >> $env:GITHUB_ENV
        echo "TAG_NAME=$tagName" >> $env:GITHUB_ENV

    - name: Environment variable for dev
      if: ${{ inputs.prerelease == true && inputs.channel == 'dev'}}
      run: |
        echo "MINOR_PATCH=1.0" >> $env:GITHUB_ENV
        echo "TAG_NAME=${env:TAG_NAME}-dev" >> $env:GITHUB_ENV

    - name: Environment variable for beta
      if: ${{ inputs.prerelease == true && inputs.channel == 'beta'}}
      run: |
        echo "MINOR_PATCH=0.1" >> $env:GITHUB_ENV
        echo "TAG_NAME=${env:TAG_NAME}-beta" >> $env:GITHUB_ENV

    - name: Environment variable for stable
      if: ${{ inputs.prerelease == false && inputs.channel == 'stable' }}
      run: echo "MINOR_PATCH=0.0" >> $env:GITHUB_ENV

    - name: Set build version when version is empty
      if: ${{ inputs.version == '' }}
      run: echo "BUILD_VERSION=${env:CUR_DATE}.${env:MINOR_PATCH}" >> $env:GITHUB_ENV

    - name: Set build version when version is not empty
      if: ${{ inputs.version != '' }}
      run: echo "BUILD_VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

    - name: Check BUILD_VERSION environment variable
      run: echo "${env:BUILD_VERSION}"

    - name: Check TAG_NAME environment variable
      run: echo "${env:TAG_NAME}"

    - name: Check cur_year environment variable
      run: echo "${env:CUR_YEAR}"

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install system dependencies
      run: |
        choco install gettext --no-progress -y
        "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "C:\Program Files\gettext-iconv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "C:\ProgramData\chocolatey\lib\gettext\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install dependencies with uv
      run: uv sync

    - name: Lint with ruff
      run: uv run ruff check addon

    - name: Type check with mypy
      run: uv run --with mypy mypy addon

    - name: Add add-on version
      env:
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
        CUR_YEAR: ${{ env.CUR_YEAR }}
        UPDATE_YEAR: ${{ inputs.updateYear }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        import os
        import re

        version = os.environ['BUILD_VERSION']
        year = os.environ['CUR_YEAR']
        updateYear = os.environ['UPDATE_YEAR'].lower() == 'true'
        channel = os.environ['CHANNEL']

        with open("buildVars.py", "r", encoding="utf-8") as f:
            text = f.read()

        if updateYear:
            match = re.search(
                r'addon_lastTestedNVDAVersion=(?:"""|\'\'\'|"|\')(\d{4})\.\d+\.\d+(?:"""|\'\'\'|"|\'),',
                text
            )
            if match:
                checkYear = match.group(1)
                if checkYear < year:
                    text = re.sub(
                        r'addon_lastTestedNVDAVersion=(?:"""|\'\'\'|"|\')\d+\.\d+\.\d+(?:"""|\'\'\'|"|\'),',
                        f'addon_lastTestedNVDAVersion="{year}.1.0",',
                        text
                    )

        text = re.sub(
            r'addon_version=(?:"""|\'\'\'|"|\').*?(?:"""|\'\'\'|"|\'),',
            f'addon_version="{version}",',
            text
        )

        with open("buildVars.py", "w", encoding="utf-8") as f:
            f.write(text)

        with open("changelog.md", "r", encoding="utf-8") as f:
            text = f.read()

        text = re.sub("Changes for [^\r\n]+", f"Changes for {version}", text, count=1)

        with open("changelog.md", "w", encoding="utf-8") as f:
            f.write(text)
      shell: python

    - name: Check if there are any changes
      id: verify_diff
      run: |
        if (git status --porcelain) { echo "changed=true" >> $env:GITHUB_OUTPUT }

    - name: Commit and push changes
      if: steps.verify_diff.outputs.changed == 'true'
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -a -m "Update buildVars and changelog"
        git tag -f $env:TAG_NAME
        git push origin HEAD:${{ github.ref_name }}
        git push origin $env:TAG_NAME --force

    - name: Build add-on
      env:
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
      run: uv run scons version="$env:BUILD_VERSION"

    - name: Calculate sha256
      run: |
        Get-ChildItem -Filter *.nvda-addon | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath sha256.txt -Encoding utf8
        }

    - name: Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          *.nvda-addon
          sha256.txt
        generate_release_notes: true
        prerelease: ${{ github.event.inputs.prerelease }}
        tag_name: ${{ env.TAG_NAME }}
        body_path: 'changelog.md'
